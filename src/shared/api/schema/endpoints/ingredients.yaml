schemas:
  Ingredient:
    type: object
    properties:
      id:
        type: integer
        format: int32
      name:
        type: string
        maxLength: 60
        example: "bacon"
      price:
        type: number
      imageUrl:
        type: string
        nullable: true
        format: uri
        example: "https://example.com/images/bacon.png"
      createdAt:
        type: string
        format: date-time
        example: "2025-08-14T12:34:56Z"
      updatedAt:
        type: string
        format: date-time
        example: "2025-08-14T12:34:56Z"
    required:
      - id
      - name
      - price
      - imageUrl
      - createdAt
      - updatedAt

  IngredientsList:
    type: array
    items:
      $ref: '#/schemas/Ingredient'

getIngredients:
  summary: Get all ingredients
  responses:
    '200':
      description: List of ingredients
      content:
        application/json:
          schema:
            $ref: '#/schemas/IngredientsList'